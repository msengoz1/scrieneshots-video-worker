name: Vexira Turkish Translation Test

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET_NAME }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download English transcript
        run: |
          aws s3 cp \
            "s3://${B2_BUCKET}/subtitle-tests/transcript-en.txt" \
            transcript-en.txt \
            --endpoint-url "https://${B2_ENDPOINT}"

      - name: Install Vexira
        run: |
          git clone https://github.com/uixova/vexira.git
          python -m pip install --upgrade pip
          pip install torch sentencepiece huggingface_hub

          mkdir -p vexira/models

          huggingface-cli download \
            uixova/vexira \
            vexira_sft.pt \
            vexira_spm.model \
            --local-dir vexira/models

      - name: Translate with Vexira
        run: |
          cd vexira

          python - <<'PY'
          import sys
          import re

          sys.path.insert(0, ".")

          from translate import Translator

          translator = Translator()

          with open("../transcript-en.txt", "r", encoding="utf-8") as f:
              lines = f.readlines()

          output = []

          pattern = re.compile(
              r'^\[(.*?) --> (.*?)\]\s*(.*)$'
          )

          for line in lines:
              line = line.strip()

              if not line:
                  continue

              match = pattern.match(line)

              if not match:
                  continue

              start = match.group(1)
              end = match.group(2)
              english = match.group(3).strip()

              if not english:
                  continue

              turkish = translator.translate(
                  [english],
                  tgt_lang="tr"
              )[0]

              output.append(
                  f"[{start} --> {end}] "
                  f"EN: {english}\n"
                  f"TR: {turkish}\n"
              )

          with open(
              "../vexira-comparison.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(output))

          print(f"Translated {len(output)} subtitle segments.")
          PY

      - name: Upload comparison to B2
        run: |
          aws s3 cp \
            vexira-comparison.txt \
            "s3://${B2_BUCKET}/subtitle-tests/vexira-comparison.txt" \
            --endpoint-url "https://${B2_ENDPOINT}"

      - name: Verify
        run: |
          aws s3 ls \
            "s3://${B2_BUCKET}/subtitle-tests/vexira-comparison.txt" \
            --endpoint-url "https://${B2_ENDPOINT}"
