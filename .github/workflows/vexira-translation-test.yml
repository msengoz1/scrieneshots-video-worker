name: Vexira Turkish Translation Test

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET_NAME }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download English transcript from B2
        run: |
          aws s3 cp \
            "s3://${B2_BUCKET}/subtitle-tests/transcript-en.txt" \
            transcript-en.txt \
            --endpoint-url "https://${B2_ENDPOINT}"

          echo "Transcript downloaded:"
          ls -lh transcript-en.txt

      - name: Install Vexira dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch sentencepiece numpy

      - name: Download Vexira
        run: |
          git clone https://huggingface.co/MetinLutfi/vexira vexira

          echo "Vexira files:"
          find vexira -maxdepth 2 -type f | head -50

      - name: Find Vexira model files
        run: |
          cd vexira

          CKPT=$(find . -type f \( -name "*.pt" -o -name "*.pth" \) | head -1)
          SPM=$(find . -type f \( -name "*.model" -o -name "*.spm" \) | head -1)

          echo "CKPT=$CKPT"
          echo "SPM=$SPM"

          if [ -z "$CKPT" ]; then
            echo "ERROR: Vexira checkpoint file not found"
            exit 1
          fi

          if [ -z "$SPM" ]; then
            echo "ERROR: Vexira SentencePiece model not found"
            exit 1
          fi

          echo "VEXIRA_CKPT=$CKPT" >> "$GITHUB_ENV"
          echo "VEXIRA_SPM=$SPM" >> "$GITHUB_ENV"

      - name: Prepare clean English text
        run: |
          python - <<'PY'
          import re

          with open("transcript-en.txt", "r", encoding="utf-8") as f:
              lines = f.readlines()

          cleaned = []

          for line in lines:
              line = line.strip()

              if not line:
                  continue

              line = re.sub(
                  r'^\[[0-9:,]+\s*-->\s*[0-9:,]+\]\s*',
                  '',
                  line
              )

              if line:
                  cleaned.append(line)

          with open("vexira-input.txt", "w", encoding="utf-8") as f:
              for line in cleaned:
                  f.write(line + "\n")

          print("Prepared", len(cleaned), "lines")
          PY

          echo "Input preview:"
          head -10 vexira-input.txt

      - name: Translate with Vexira
        run: |
          cd vexira

          TRANSLATE=$(find . -type f -name "translate.py" | head -1)

          if [ -z "$TRANSLATE" ]; then
            echo "ERROR: translate.py not found"
            exit 1
          fi

          echo "Using translator: $TRANSLATE"
          echo "Using checkpoint: $VEXIRA_CKPT"
          echo "Using SPM: $VEXIRA_SPM"

          python "$TRANSLATE" \
            --ckpt "$VEXIRA_CKPT" \
            --spm "$VEXIRA_SPM" \
            --device cpu \
            --to tr \
            --file "../vexira-input.txt" \
            --out "../vexira-output.txt"

      - name: Show translation result
        run: |
          echo "===== VEXIRA TURKISH OUTPUT ====="
          head -50 vexira-output.txt

          echo ""
          echo "Output file:"
          ls -lh vexira-output.txt

      - name: Upload Vexira result to B2
        run: |
          aws s3 cp \
            vexira-output.txt \
            "s3://${B2_BUCKET}/translation-tests/vexira-output.txt" \
            --endpoint-url "https://${B2_ENDPOINT}"

      - name: Verify
        run: |
          aws s3 ls \
            "s3://${B2_BUCKET}/translation-tests/vexira-output.txt" \
            --endpoint-url "https://${B2_ENDPOINT}"
