name: Vexira Turkish Translation Test

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET_NAME }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download English transcript from B2
        run: |
          aws s3 cp \
            "s3://${B2_BUCKET}/subtitle-tests/transcript-en.txt" \
            "transcript-en.txt" \
            --endpoint-url "https://${B2_ENDPOINT}"

          echo "Transcript downloaded:"
          head -n 10 transcript-en.txt

      - name: Install Vexira
        run: |
          python -m pip install --upgrade pip
          pip install torch sentencepiece huggingface_hub

          git clone https://github.com/uixova/vexira.git
          cd vexira

          mkdir -p models

          hf download \
            uixova/vexira \
            vexira_sft.pt \
            vexira_spm.model \
            --local-dir models

          echo "Vexira files:"
          find . -maxdepth 2 -type f | sort

      - name: Prepare clean English text
        run: |
          python <<'PY'
          import re

          with open("transcript-en.txt", "r", encoding="utf-8") as f:
              lines = f.readlines()

          cleaned = []

          for line in lines:
              line = line.strip()

              if not line:
                  continue

              # Remove Whisper timestamps such as:
              # [00:00:01,000 --> 00:00:04,000]
              line = re.sub(
                  r'^\[[^\]]+\]\s*',
                  '',
                  line
              )

              if line:
                  cleaned.append(line)

          # Small quality test first.
          # No need to translate the entire video until
          # we know Vexira produces acceptable Turkish.
          cleaned = cleaned[:20]

          with open("vexira-input.txt", "w", encoding="utf-8") as f:
              for line in cleaned:
                  f.write(line + "\n")

          print("Prepared", len(cleaned), "lines")
          print()
          print("\n".join(cleaned[:5]))
          PY

      - name: Translate with Vexira
        run: |
          cd vexira

          echo "Checking Vexira usage..."
          python translate.py --help || true

          python translate.py \
            --checkpoint models/vexira_sft.pt \
            --spm_model models/vexira_spm.model \
            --input ../vexira-input.txt \
            --output ../vexira-output.txt

      - name: Show translation result
        if: success()
        run: |
          echo "=============================="
          echo "VEXIRA TURKISH OUTPUT"
          echo "=============================="
          cat vexira-output.txt

      - name: Upload comparison to B2
        if: success()
        run: |
          aws s3 cp \
            "vexira-input.txt" \
            "s3://${B2_BUCKET}/translation-tests/vexira-input.txt" \
            --endpoint-url "https://${B2_ENDPOINT}"

          aws s3 cp \
            "vexira-output.txt" \
            "s3://${B2_BUCKET}/translation-tests/vexira-output.txt" \
            --endpoint-url "https://${B2_ENDPOINT}"

      - name: Verify
        if: success()
        run: |
          aws s3 ls \
            "s3://${B2_BUCKET}/translation-tests/" \
            --endpoint-url "https://${B2_ENDPOINT}"
